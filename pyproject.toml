[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "veilrelay"
version = "0.1.0"
description = "A self-hosted, OpenAI-compatible privacy proxy for LLM prompts"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "VeilRelay contributors" }]
keywords = ["llm", "privacy", "pii", "proxy", "redaction", "secrets"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "fastapi==0.128.2",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "uvicorn[standard]==0.48.0",
]

[project.optional-dependencies]
ner = ["spacy==3.8.11"]
dev = [
  "bandit==1.8.6",
  "build==1.2.2.post1",
  "coverage==7.6.10",
  "hypothesis==6.122.3",
  "mypy==1.14.1",
  "pip-audit==2.7.3",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "ruff==0.9.2",
]
bench = ["presidio-analyzer==2.2.359", "datasets==3.2.0"]

[project.scripts]
veil = "veilrelay.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["veilrelay.detectors", "veilrelay.models", "veilrelay.policy", "veilrelay.vault", "veilrelay.stream"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "S101", "S104", "S105", "S106", "S110"]

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["veilrelay"]

[tool.bandit]
exclude_dirs = ["tests", "bench"]
skips = ["B101"]
